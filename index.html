<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ario's Fun Little Secret Santa</title>
<style>
  :root {
    --pine: #1f5c3d;
    --pine-dark: #14432c;
    --berry: #b3232c;
    --berry-dark: #8c1a22;
    --cream: #fdf6e8;
    --paper: #fffaf0;
    --ink: #2c2a26;
    --muted: #6b655c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(31,92,61,.07) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 42%, rgba(179,35,44,.07) 0 2px, transparent 3px),
      radial-gradient(circle at 34% 82%, rgba(31,92,61,.06) 0 2px, transparent 3px);
    color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border: 1px solid rgba(31,92,61,.18);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(44,42,38,.10);
    padding: 28px 22px 32px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin: 12px 0 6px;
    color: var(--pine-dark);
    letter-spacing: -.01em;
  }
  .tag { color: var(--berry); font-weight: 600; margin: 0 0 20px; }
  .btn {
    display: block;
    padding: 16px 20px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    background: var(--pine);
    color: #fff;
    margin-top: 12px;
  }
  .btn:active { background: var(--pine-dark); }
</style>
</head>
<body>
  <main class="card">
    <h1>Ario's Fun Little Secret Santa</h1>
    <p class="tag">A private family gift exchange</p>

    <a class="btn js-apk" referrerpolicy="no-referrer"
       href="https://github.com/ario58/ArioSecretSantaReleases/releases/latest">Get Android App</a>
  </main>

  <script src="apk.js"></script>
  <script>Array.prototype.forEach.call(document.querySelectorAll(".js-apk"), setApkHref);</script>
</body>
</html>
