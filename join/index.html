<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>Join &mdash; Ario's Fun Little Secret Santa</title>
<style>
  :root {
    --pine: #1f5c3d;
    --pine-dark: #14432c;
    --berry: #b3232c;
    --berry-dark: #8c1a22;
    --cream: #fdf6e8;
    --paper: #fffaf0;
    --ink: #2c2a26;
    --muted: #6b655c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(31,92,61,.07) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 42%, rgba(179,35,44,.07) 0 2px, transparent 3px),
      radial-gradient(circle at 34% 82%, rgba(31,92,61,.06) 0 2px, transparent 3px);
    color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border: 1px solid rgba(31,92,61,.18);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(44,42,38,.10);
    padding: 28px 22px 32px;
    text-align: center;
  }
  h1 { font-size: 26px; margin: 10px 0 4px; color: var(--pine-dark); }
  .lede { font-size: 20px; font-weight: 700; color: var(--berry); margin: 18px 0 4px; }
  .label {
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 6px;
  }
  .code {
    font: 700 30px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .18em;
    color: var(--pine-dark);
    background: #fff;
    border: 2px dashed rgba(31,92,61,.35);
    border-radius: 14px;
    padding: 14px 10px;
    word-break: break-all;
  }
  .btn {
    display: block;
    padding: 16px 20px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    background: var(--pine);
    color: #fff;
    margin-top: 14px;
  }
  .btn:active { background: var(--pine-dark); }
  .btn.berry { background: var(--berry); }
  .btn.berry:active { background: var(--berry-dark); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="card">
    <h1>Ario&rsquo;s Fun Little Secret Santa</h1>

    <section id="valid" hidden>
      <p class="lede">You&rsquo;ve been invited</p>
      <div class="label">Invite code</div>
      <div class="code" id="code"></div>

      <a class="btn" id="open" href="#">Open Secret Santa</a>
      <a class="btn berry js-apk" referrerpolicy="no-referrer" href="https://github.com/ario58/ArioSecretSantaReleases/releases/latest">Download Android App</a>
    </section>

    <section id="invalid" hidden>
      <p class="lede">This invitation link is invalid.</p>
      <a class="btn berry js-apk" referrerpolicy="no-referrer" href="https://github.com/ario58/ArioSecretSantaReleases/releases/latest">Download Android App</a>
    </section>
  </main>

<script src="../apk.js"></script>
<script>
(function () {
  // The app download never depends on the invite code, so wire it up first.
  Array.prototype.forEach.call(document.querySelectorAll(".js-apk"), setApkHref);

  // Display form XXXX-XXXX-XXXX-XXXX normalizes to the app's canonical 16 chars.
  var raw = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase().replace(/-/g, '');
  var code = /^[0-9A-HJKMNP-TV-Z]{16}$/.test(raw) ? raw : null;

  if (!code) {
    document.getElementById('invalid').hidden = false;
    return;
  }

  document.getElementById('code').textContent = code;   // text only, never HTML
  document.getElementById('open').href = 'secretsanta://join?code=' + encodeURIComponent(code);
  document.getElementById('valid').hidden = false;
})();
</script>
</body>
</html>
